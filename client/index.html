<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"/>
<title>HIBIOS · Operations System</title>

<!-- PWA: installable on iOS, Android, Desktop -->
<link rel="manifest" href="/manifest.webmanifest"/>
<meta name="theme-color" content="#1e3a2b"/>
<meta name="application-name" content="HIBIOS"/>

<!-- iOS PWA (Add to Home Screen) -->
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="HIBIOS"/>
<link rel="apple-touch-icon" sizes="180x180" href="/manus-storage/apple-touch-icon_bdb48264.png"/>
<!-- iPad splash screens (dark green bg with logo) -->
<link rel="apple-touch-startup-image" href="/manus-storage/icon-512_02d72b13.png" media="(device-width: 768px) and (device-height: 1024px)"/>
<link rel="apple-touch-startup-image" href="/manus-storage/icon-512_02d72b13.png" media="(device-width: 810px) and (device-height: 1080px)"/>
<link rel="apple-touch-startup-image" href="/manus-storage/icon-512_02d72b13.png" media="(device-width: 820px) and (device-height: 1180px)"/>
<link rel="apple-touch-startup-image" href="/manus-storage/icon-512_02d72b13.png" media="(device-width: 834px) and (device-height: 1194px)"/>
<link rel="apple-touch-startup-image" href="/manus-storage/icon-512_02d72b13.png" media="(device-width: 1024px) and (device-height: 1366px)"/>

<!-- Android / Windows -->
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="msapplication-TileColor" content="#1e3a2b"/>
<meta name="msapplication-TileImage" content="/manus-storage/icon-192_5e551bf9.png"/>

<!-- Icons -->
<link rel="icon" type="image/png" sizes="192x192" href="/manus-storage/icon-192_5e551bf9.png"/>
<link rel="icon" type="image/svg+xml" href="/icon.svg"/>

<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+JP:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  .boot {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    background: var(--bg-base, #fdfdfb);
    z-index: 9999;
    transition: opacity 400ms ease-out;
  }
  .boot.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body data-screen-label="App">
  <div id="root"></div>
  <div class="boot" id="boot">
    <div style="text-align: center; color: var(--matcha-700, #15803d);">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <g style="transform-origin: 12px 14px; animation: whisk 900ms cubic-bezier(0.83, 0, 0.17, 1) infinite;">
          <path d="M12 3v9"/>
          <path d="M9 4v8M15 4v8" opacity=".8"/>
          <path d="M9 12c0 1.5 1.3 2.5 3 2.5s3-1 3-2.5"/>
          <path d="M9 14l-1 6M15 14l1 6M12 15v5"/>
        </g>
      </svg>
      <div style="margin-top: 16px; font-size: 13px; color: var(--text-tertiary, #78716c); letter-spacing: 0.06em;">brewing…</div>
    </div>
  </div>

  <script type="module" src="/src/main.jsx"></script>

  <script>
    setTimeout(() => {
      const b = document.getElementById('boot');
      if (b) {
        b.classList.add('gone');
        setTimeout(() => b.remove(), 400);
      }
    }, 800);
  </script>

  <script
    defer
    src="%VITE_ANALYTICS_ENDPOINT%/umami"
    data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
</body>
</html>
