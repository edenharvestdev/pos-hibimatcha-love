# ============================================
# Deploy to Google Cloud Run
# ============================================
# Triggers on push to 'main' branch.
# Builds Docker image → pushes to Artifact Registry → deploys to Cloud Run.
#
# Required GitHub Secrets:
#   GCP_PROJECT_ID        — your GCP project ID (e.g. "hibi-pos-prod")
#   GCP_SA_KEY            — base64-encoded service account key JSON
#   GCP_REGION            — region for Cloud Run (e.g. "asia-southeast1")
#   CLOUD_SQL_CONNECTION  — Cloud SQL connection name (e.g. "project:region:instance")
#   DATABASE_URL          — full mysql connection string for production
#
# Required GitHub Variables (non-secret):
#   VITE_BRAND_NAME       — e.g. "Hibi Matcha"
#   VITE_PRIMARY_COLOR    — e.g. "#16a34a"

name: Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

env:
  GCP_PROJECT: ${{ secrets.GCP_PROJECT_ID }}
  GCP_REGION: ${{ secrets.GCP_REGION || 'asia-southeast1' }}
  SERVICE_NAME: hibi-pos
  IMAGE_NAME: asia-southeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/hibi-pos/app

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # 1. Checkout source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Set up Cloud SDK (gcloud)
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      # 4. Configure Docker to use gcloud as credential helper
      - name: Configure Docker
        run: gcloud auth configure-docker asia-southeast1-docker.pkg.dev --quiet

      # 5. Create Artifact Registry repo if not exists
      - name: Ensure Artifact Registry repo
        run: |
          gcloud artifacts repositories describe hibi-pos \
            --location=${{ env.GCP_REGION }} \
            --format="value(name)" 2>/dev/null || \
          gcloud artifacts repositories create hibi-pos \
            --repository-format=docker \
            --location=${{ env.GCP_REGION }} \
            --description="Hibi Matcha POS Docker images"

      # 6. Build and push Docker image
      - name: Build and Push Docker image
        run: |
          docker build \
            --build-arg VITE_BRAND_NAME="${{ vars.VITE_BRAND_NAME || 'Hibi Matcha' }}" \
            --build-arg VITE_PRIMARY_COLOR="${{ vars.VITE_PRIMARY_COLOR || '#16a34a' }}" \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      # 7. Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --platform=managed \
            --port=3000 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=5 \
            --allow-unauthenticated \
            --set-env-vars="NODE_ENV=production" \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars="JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            --set-env-vars="OMISE_PUBLIC_KEY=${{ secrets.OMISE_PUBLIC_KEY }}" \
            --set-env-vars="OMISE_SECRET_KEY=${{ secrets.OMISE_SECRET_KEY }}" \
            --set-env-vars="PUSHER_APP_ID=${{ secrets.PUSHER_APP_ID }}" \
            --set-env-vars="PUSHER_KEY=${{ secrets.PUSHER_KEY }}" \
            --set-env-vars="PUSHER_SECRET=${{ secrets.PUSHER_SECRET }}" \
            --set-env-vars="PUSHER_CLUSTER=${{ secrets.PUSHER_CLUSTER }}" \
            --add-cloudsql-instances="${{ secrets.CLOUD_SQL_CONNECTION }}" \
            --quiet

      # 8. Show the deployed URL
      - name: Show Service URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --format='value(status.url)')
          echo "🚀 Deployed to: $URL"
          echo "### ✅ Deployed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** $URL" >> $GITHUB_STEP_SUMMARY
