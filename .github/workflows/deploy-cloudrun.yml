# ============================================
# Deploy to Google Cloud Run (Workload Identity Federation)
# ============================================
# Triggers on push to 'main' branch → auto-deploys to Cloud Run
#
# Required GitHub Secrets:
#   GCP_WORKLOAD_IDENTITY_PROVIDER  — WIF provider resource name
#   GCP_SERVICE_ACCOUNT             — SA email for impersonation
#   DATABASE_URL                    — mysql connection string
#   JWT_SECRET                      — JWT signing secret
#   MEMBER_JWT_SECRET               — Member JWT secret
#   SESSION_SECRET                  — Session secret
#   CLOUD_SQL_CONNECTION            — Cloud SQL instance connection name
#
# Optional GitHub Secrets:
#   PUSHER_APP_ID, PUSHER_KEY, PUSHER_SECRET, PUSHER_CLUSTER
#   OMISE_PUBLIC_KEY, OMISE_SECRET_KEY
#   GOOGLE_SHEET_ID, GOOGLE_SHEETS_SA_KEY_BASE64

name: 🚀 Deploy to Cloud Run

on:
  push:
    branches: [main]
  workflow_dispatch: # Manual trigger from GitHub UI

env:
  GCP_PROJECT: project-7def1400-8040-401c-b35
  GCP_REGION: asia-southeast1
  SERVICE_NAME: hibi-pos
  IMAGE_REGISTRY: asia-southeast1-docker.pkg.dev
  IMAGE_REPO: cloud-run-source-deploy
  IMAGE_NAME: asia-southeast1-docker.pkg.dev/project-7def1400-8040-401c-b35/cloud-run-source-deploy/hibi-pos

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Required for Workload Identity Federation

    steps:
      # ── 1. Checkout code ──────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Authenticate to GCP via WIF (no SA key needed) ────────────
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      # ── 3. Set up gcloud ──────────────────────────────────────────────
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}

      # ── 4. Configure Docker auth for Artifact Registry ───────────────
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.IMAGE_REGISTRY }} --quiet

      # ── 5. Build & Push Docker image ──────────────────────────────────
      - name: Build and Push Docker image
        run: |
          docker build \
            --build-arg VITE_BRAND_NAME="Hibi Matcha" \
            --build-arg VITE_PRIMARY_COLOR="#16a34a" \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      # ── 6. Deploy to Cloud Run ────────────────────────────────────────
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }} \
            --platform=managed \
            --port=3000 \
            --memory=512Mi \
            --cpu=1 \
            --min-instances=0 \
            --max-instances=3 \
            --allow-unauthenticated \
            --add-cloudsql-instances="${{ secrets.CLOUD_SQL_CONNECTION }}" \
            --set-env-vars="NODE_ENV=production" \
            --set-env-vars="DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars="INSTANCE_CONNECTION_NAME=${{ secrets.CLOUD_SQL_CONNECTION }}" \
            --set-env-vars="JWT_SECRET=${{ secrets.JWT_SECRET }}" \
            --set-env-vars="MEMBER_JWT_SECRET=${{ secrets.MEMBER_JWT_SECRET }}" \
            --set-env-vars="SESSION_SECRET=${{ secrets.SESSION_SECRET }}" \
            --set-env-vars="PUSHER_APP_ID=${{ secrets.PUSHER_APP_ID }}" \
            --set-env-vars="PUSHER_KEY=${{ secrets.PUSHER_KEY }}" \
            --set-env-vars="PUSHER_SECRET=${{ secrets.PUSHER_SECRET }}" \
            --set-env-vars="PUSHER_CLUSTER=${{ secrets.PUSHER_CLUSTER }}" \
            --set-env-vars="OMISE_PUBLIC_KEY=${{ secrets.OMISE_PUBLIC_KEY }}" \
            --set-env-vars="OMISE_SECRET_KEY=${{ secrets.OMISE_SECRET_KEY }}" \
            --set-env-vars="GOOGLE_SHEET_ID=${{ secrets.GOOGLE_SHEET_ID }}" \
            --set-env-vars="GOOGLE_SHEETS_SA_KEY_BASE64=${{ secrets.GOOGLE_SHEETS_SA_KEY_BASE64 }}" \
            --quiet

      # ── 7. Report deployed URL ────────────────────────────────────────
      - name: Show deployed URL
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.GCP_REGION }} \
            --project=${{ env.GCP_PROJECT }} \
            --format='value(status.url)')
          echo "🚀 Deployed: $URL"
          echo "### ✅ Deployed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** [$URL]($URL)" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
